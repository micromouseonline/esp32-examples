
[platformio]
src_dir = .
extra_configs = ../base-boards.ini
default_envs = template-esp32-s3-super-mini

# ------------------------------------------------------------------------------
# Central Repository Release Metadata (Non-Building Configuration Block)
# ------------------------------------------------------------------------------
; [env:version_metadata]
; release_version = 0.1.0

[env:template-esp32-s3-zero]
extends = base_s3_zero

[env:template-esp32-s3-super-mini]
; ESP32-S3 Super Mini. STATUS_LED=48 is its onboard NeoPixel.
extends = base_s3_super_mini
lib_deps =
    ${base_s3_super_mini.lib_deps}
    jchristensen/JC_Button @ ^2.1.5
build_flags =
    ${base_s3_super_mini.build_flags}
    -D ARDUINO_TINYUSB=1
    -D CORE_DEBUG_LEVEL=0

[env:template-esp32-s3-cyd-touch-freenove]
extends = base_s3_cyd_touch_freenove

[env:template-esp32-c3]
extends = base_c3_super_mini

[env:template-esp32-c3-xiao]
extends = base_c3_xiao

# ESP32-C6 envs disabled -- see base-boards.ini's env_common platform comment
# for why (dropped the pioarduino fork for cross-machine reliability) and how
# to re-enable.
