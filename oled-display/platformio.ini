
[platformio]
src_dir = .
extra_configs = ../base-boards.ini

# ------------------------------------------------------------------------------
# Central Repository Release Metadata (Non-Building Configuration Block)
# ------------------------------------------------------------------------------
[env:version_metadata]
release_version = 0.1.0

# ------------------------------------------------------------------------------
# OLED Display Variants (Non-Building Configuration Blocks)
# Select which physical display module is compiled in for a given env.
# Values must match the DISPLAY_* indices in oled-manager.h.
# ------------------------------------------------------------------------------
[oled_ssd1306_128x64]
build_flags = -D ACTIVE_DISPLAY_INDEX=2

[oled_ssd1306_128x32]
build_flags = -D ACTIVE_DISPLAY_INDEX=1

[oled_ssd1306_64x32]
build_flags = -D ACTIVE_DISPLAY_INDEX=0

[oled_sh1106_128x64]
build_flags = -D ACTIVE_DISPLAY_INDEX=3


[env:oled-display-esp32-s3-zero-ssd1306-128x64]
extends = base_s3_zero, feature_oled, oled_ssd1306_128x64
lib_deps =
    ${base_s3_zero.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${base_s3_zero.build_flags}
    ${feature_oled.build_flags}
    ${oled_ssd1306_128x64.build_flags}

[env:oled-display-esp32-s3-zero-ssd1306-128x32]
extends = base_s3_zero, feature_oled, oled_ssd1306_128x32
lib_deps =
    ${base_s3_zero.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${base_s3_zero.build_flags}
    ${feature_oled.build_flags}
    ${oled_ssd1306_128x32.build_flags}

[env:oled-display-esp32-s3-zero-ssd1306-64x32]
extends = base_s3_zero, feature_oled, oled_ssd1306_64x32
lib_deps =
    ${base_s3_zero.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${base_s3_zero.build_flags}
    ${feature_oled.build_flags}
    ${oled_ssd1306_64x32.build_flags}

[env:oled-display-esp32-s3-zero-sh1106-128x64]
extends = base_s3_zero, feature_oled, oled_sh1106_128x64
lib_deps =
    ${base_s3_zero.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${base_s3_zero.build_flags}
    ${feature_oled.build_flags}
    ${oled_sh1106_128x64.build_flags}

[env:oled-display-esp32-s3-super-mini]
extends = base_s3_super_mini, feature_oled
lib_deps =
    ${base_s3_super_mini.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${base_s3_super_mini.build_flags}
    ${feature_oled.build_flags}

[env:oled-display-esp32-s3-cyd-touch-freenove]
extends = base_s3_cyd_touch_freenove

[env:oled-display-esp32-c3]
extends = base_c3_super_mini, feature_oled
lib_deps =
    ${env_common.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${base_c3_super_mini.build_flags}
    ${feature_oled.build_flags}

[env:oled-display-esp32-c3-xiao]
extends = base_c3_xiao, feature_oled
lib_deps =
    ${env_common.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${base_c3_xiao.build_flags}
    ${feature_oled.build_flags}

[env:oled-display-esp32-c6-xiao]
extends = base_c6_xiao, feature_oled
lib_deps =
    ${env_common.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${base_c6_xiao.build_flags}
    ${feature_oled.build_flags}

[env:oled-display-esp32-c6]
extends = base_c6_super_mini, feature_oled
lib_deps =
    ${base_c6_super_mini.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${base_c6_super_mini.build_flags}
    ${feature_oled.build_flags}
