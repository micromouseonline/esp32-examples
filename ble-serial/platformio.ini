
[platformio]
src_dir = .
extra_configs = ../base-boards.ini

# ------------------------------------------------------------------------------
# Central Repository Release Metadata (Non-Building Configuration Block)
# ------------------------------------------------------------------------------
[env:version_metadata]
release_version = 0.1.0


[env:ble-serial-esp32-s3-zero]
extends = base_s3_zero, feature_ble
lib_deps =
    ${base_s3_zero.lib_deps}
    ${feature_ble.lib_deps}
build_flags =
    ${base_s3_zero.build_flags}
    ${feature_ble.build_flags}

