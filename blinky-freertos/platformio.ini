
[platformio]
src_dir = .
extra_configs = ../base-boards.ini 

# ------------------------------------------------------------------------------
# Central Repository Release Metadata (Non-Building Configuration Block)
# ------------------------------------------------------------------------------
[env:version_metadata]
release_version = 0.1.0

[env:blinky-freertos-esp32-s3-zero]
extends = base_s3_zero

[env:blinky-freertos-esp32-s3-super-mini]
